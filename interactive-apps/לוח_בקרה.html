<head>

  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>לוח בקרה · מתמטיקה · ברנר</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23c45c26'/%3E%3Cpath d='M38 0h12c5.5 0 10 4.5 10 10v8H38V0Z' fill='%23e8c4ad'/%3E%3Cpath d='M22 18c6.8 0 11.2 3.6 11.2 9.1 0 3.6-2.1 6.2-5.6 7.6 4.2 1.3 6.9 4.3 6.9 8.6 0 6.2-5.1 10.7-13.2 10.7H12.5V18H22Zm-2.6 13.8h2.2c3.1 0 4.9-1.5 4.9-3.8s-1.8-3.8-4.8-3.8h-2.3v7.6Zm0 16.2h2.8c3.6 0 5.7-1.8 5.7-4.5s-2.1-4.4-5.8-4.4h-2.7v8.9Z' fill='%23fffaf3'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --desk: #e8dfd2;
      --desk-deep: #d9cbb8;
      --ink: #1c1610;
      --muted: #6a5d50;
      --paper: #fffaf3;
      --line: rgba(28, 22, 16, 0.1);
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
      --shadow: 0 14px 28px rgba(28, 22, 16, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Assistant", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 18%, rgba(255, 255, 255, 0.45), transparent 28%),
        repeating-linear-gradient(90deg, transparent 0, transparent 46px, rgba(28, 22, 16, 0.03) 46px, rgba(28, 22, 16, 0.03) 47px),
        linear-gradient(165deg, #efe6d8 0%, var(--desk) 55%, var(--desk-deep) 100%);
    }

    .page {
      width: min(1100px, calc(100% - 2rem));
      margin: 0 auto;
      padding: 1.4rem 0 3.5rem;
    }

    .toolbar {
      display: flex;
      align-items: stretch;
      gap: 0.75rem;
      margin-bottom: 1.6rem;
    }

    .mashov {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 72px;
      padding: 0.9rem 1.2rem;
      border-radius: 18px;
      text-decoration: none;
      color: #f7efe4;
      background: linear-gradient(155deg, #2a2118 0%, #1a140f 100%);
      box-shadow: 0 14px 28px rgba(28, 22, 16, 0.16);
      transition: transform 0.25s var(--ease);
    }

    .mashov:hover { transform: translateY(-2px); }
    .mashov:focus-visible { outline: 3px solid #c45c26; outline-offset: 3px; }
    .mashov.is-empty { opacity: 0.55; pointer-events: none; }

    .mashov-title {
      font-size: 1.55rem;
      font-weight: 800;
      letter-spacing: 0.02em;
    }

    .mashov-go {
      font-size: 0.95rem;
      font-weight: 700;
      opacity: 0.8;
    }

    .gear {
      width: 72px;
      border: 0;
      border-radius: 18px;
      background: var(--paper);
      color: var(--ink);
      box-shadow: var(--shadow);
      cursor: pointer;
      font: inherit;
      font-weight: 800;
      font-size: 1.2rem;
    }

    .gear:hover { background: #fff; }
    .gear:focus-visible { outline: 3px solid #3d4f8a; outline-offset: 3px; }
    .gear svg {
      width: 1.45rem;
      height: 1.45rem;
      display: block;
      margin: 0 auto;
    }

    .block { margin-bottom: 1.7rem; }

    .block h2 {
      margin: 0 0 0.75rem;
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--muted);
    }

    .shortcut .folder-summary { min-height: 92px; }

    .groups, .cards {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    .folder {
      --tone: #c45c26;
      border-radius: 8px 22px 22px 22px;
      background: color-mix(in srgb, var(--tone) 10%, var(--paper));
      box-shadow: var(--shadow);
      overflow: visible;
    }

    .folder-summary {
      list-style: none;
      cursor: pointer;
      display: grid;
      grid-template-columns: auto 1fr;
      align-items: center;
      gap: 1rem;
      min-height: 132px;
      padding: 1.15rem 1.2rem;
      position: relative;
      user-select: none;
    }

    .folder-summary::-webkit-details-marker { display: none; }
    .folder-summary:focus-visible { outline: 3px solid var(--tone); outline-offset: -3px; }

    .folder-tab {
      position: absolute;
      top: 0;
      right: 0;
      width: 34%;
      height: 16px;
      border-radius: 0 0 0 16px;
      background: var(--tone);
    }

    .grade {
      width: 4.2rem;
      height: 4.2rem;
      border-radius: 18px;
      display: grid;
      place-items: center;
      background: var(--tone);
      color: #fffaf3;
      font-size: 1.7rem;
      font-weight: 800;
    }

    .grade svg { display: block; }

    .folder-copy h3 { margin: 0; font-size: 1.35rem; font-weight: 800; }
    .folder-copy p { margin: 0.15rem 0 0; color: var(--muted); font-weight: 600; }

    .folder-body { padding: 0 1.05rem 1.1rem; }

    .tiles {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.7rem;
    }

    .tile, .card {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 112px;
      padding: 0.9rem 0.95rem;
      border-radius: 16px;
      background: var(--paper);
      color: var(--ink);
      text-decoration: none;
      border: 1px solid var(--line);
      box-shadow: 0 8px 16px rgba(28, 22, 16, 0.04);
      transition: transform 0.25s var(--ease);
    }

    .tile:hover, .card:hover { transform: translateY(-3px); }
    .tile:focus-visible, .card:focus-visible { outline: 2px solid var(--tone, #3d4f8a); outline-offset: 2px; }
    .tile.is-empty, .card.is-empty {
      opacity: 0.45;
      pointer-events: none;
      transform: none;
    }

    .icon {
      width: 2.1rem;
      height: 2.1rem;
      border-radius: 10px;
      display: grid;
      place-items: center;
      background: color-mix(in srgb, var(--tone) 16%, white);
      color: var(--tone);
    }

    .icon svg { width: 1.1rem; height: 1.1rem; }
    .tile strong, .card strong { font-size: 1.02rem; font-weight: 800; }
    .tile span, .card span, .meta { font-size: 0.8rem; color: var(--muted); font-weight: 600; }

    .card { --tone: #1f6f6a; min-height: 128px; }
    .card.book {
      --tone: #8a5a1f;
      border-radius: 14px 6px 6px 14px;
      background:
        linear-gradient(90deg, rgba(0, 0, 0, 0.14) 0 8px, transparent 8px),
        color-mix(in srgb, var(--tone) 88%, black);
      color: #fffaf3;
      border: 0;
    }
    .card.book span { color: rgba(255, 250, 243, 0.75); }
    .card.book { position: relative; overflow: visible; }

    .book-tip {
      position: absolute;
      right: 0;
      bottom: calc(100% + 8px);
      width: max(100%, 15rem);
      padding: 0.7rem 0.8rem;
      border-radius: 12px;
      background: #1c1610;
      color: #fffaf3;
      font-size: 0.82rem;
      font-weight: 600;
      line-height: 1.45;
      box-shadow: 0 10px 22px rgba(28, 22, 16, 0.22);
      opacity: 0;
      pointer-events: none;
      transform: translateY(4px);
      transition: opacity 0.18s ease, transform 0.18s ease;
      z-index: 5;
      text-align: right;
    }

    .book-tip b {
      display: block;
      margin-bottom: 0.25rem;
      font-size: 0.72rem;
      opacity: 0.7;
    }

    .card.book:hover .book-tip,
    .card.book:focus-visible .book-tip {
      opacity: 1;
      transform: translateY(0);
    }

    .books-card > summary { list-style: none; cursor: pointer; }
    .books-card > summary::-webkit-details-marker { display: none; }
    .book-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(8.2rem, 1fr));
      gap: 0.65rem;
      margin-top: 0.7rem;
    }

    .empty {
      grid-column: 1 / -1;
      padding: 1.1rem;
      border-radius: 16px;
      background: color-mix(in srgb, var(--paper) 70%, transparent);
      color: var(--muted);
      font-weight: 600;
    }

    .scrim {
      position: fixed;
      inset: 0;
      background: rgba(28, 22, 16, 0.55);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      z-index: 20;
    }

    .scrim.on { opacity: 1; pointer-events: auto; }

    .settings {
      position: fixed;
      inset: 0;
      width: 100%;
      background:
        radial-gradient(circle at 12% 0%, rgba(255, 255, 255, 0.55), transparent 28%),
        #fffaf3;
      box-shadow: none;
      transform: translateY(110%);
      transition: transform 0.35s var(--ease);
      z-index: 21;
      display: flex;
      flex-direction: column;
    }

    .settings.on { transform: translateY(0); }

    .settings-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      padding: 1.35rem clamp(1.25rem, 4vw, 2.5rem);
      border-bottom: 1px solid var(--line);
      background: rgba(255, 250, 243, 0.92);
      backdrop-filter: blur(8px);
      position: sticky;
      top: 0;
      z-index: 1;
    }

    .settings-head h2 { margin: 0; font-size: 1.55rem; font-weight: 800; }
    .settings-body {
      min-height: 0;
      flex: 1;
      width: min(920px, 100%);
      margin: 0 auto;
      padding: 1.6rem clamp(1.25rem, 4vw, 2.5rem) 3.5rem;
      overflow: auto;
    }

    .field { display: grid; gap: 0.45rem; margin-bottom: 1.15rem; }
    .field label, .pair label { font-size: 0.9rem; font-weight: 800; color: var(--muted); }
    .field input, .pair input, .field textarea {
      width: 100%;
      border: 1px solid #e0d4c4;
      background: #fff;
      border-radius: 12px;
      padding: 0.8rem 0.95rem;
      font: inherit;
      font-size: 1.02rem;
      color: var(--ink);
      line-height: 1.4;
    }

    .field textarea { min-height: 5.5rem; resize: vertical; }
    input[data-field="url"], input[data-field="planUrl"], #mashov-url { direction: ltr; text-align: left; }

    .pair { display: grid; grid-template-columns: 1fr 1.4fr; gap: 0.85rem; margin-bottom: 0.9rem; }
    .pair > div { display: grid; gap: 0.45rem; }

    .group-edit {
      margin: 1.5rem 0;
      padding: 1.35rem 1.3rem 1.15rem;
      border-radius: 20px;
      background: #f4ece1;
    }

    .group-edit h3 { margin: 0 0 1.05rem; font-size: 1.2rem; }
    .group-edit h4 {
      margin: 1.55rem 0 0.8rem;
      font-size: 0.95rem;
      color: var(--muted);
    }
    .sub-card {
      margin: 0 0 1rem;
      padding: 1rem 1rem 0.55rem;
      border-radius: 14px;
      background: rgba(255, 250, 243, 0.85);
    }
    .row-actions { display: flex; justify-content: space-between; align-items: center; gap: 0.75rem; margin-top: 1rem; flex-wrap: wrap; }

    button.btn, .btn {
      border: 0;
      border-radius: 12px;
      padding: 0.7rem 1.05rem;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
      background: #1c1610;
      color: #fffaf3;
    }

    button.ghost { background: transparent; color: #8a3b1f; }
    button.light { background: #fff; color: var(--ink); border: 1px solid #e0d4c4; }

    .save-status {
      margin: 0 0 1.1rem;
      padding: 0.85rem 1rem;
      border-radius: 12px;
      background: #e7f3ea;
      color: #1f6f6a;
      font-weight: 700;
      font-size: 0.95rem;
    }

    .save-status.err { background: #f8e6df; color: #8a3b1f; }
    .hint-note { margin: 0 0 1.25rem; color: var(--muted); font-size: 0.92rem; font-weight: 600; line-height: 1.55; }
    .file-save-row { display: grid; gap: 0.55rem; margin: 0 0 1rem; }
    .file-save-row .btn { width: 100%; }

    .sync-banner {
      display: flex;
      gap: 0.85rem;
      align-items: center;
      justify-content: space-between;
      margin: 0 0 1.3rem;
      padding: 0.9rem 1.05rem;
      border-radius: 16px;
      background: #fff6e8;
      box-shadow: var(--shadow);
    }
    .sync-banner[hidden] { display: none !important; }
    .sync-banner p {
      margin: 0;
      font-weight: 700;
      line-height: 1.45;
      color: var(--ink);
    }
    .sync-banner .btn { flex: 0 0 auto; white-space: nowrap; }

    .group-shell { min-width: 0; border-radius: 22px; background: var(--paper); box-shadow: var(--shadow); align-self: start; }
    .group-shell > .folder { box-shadow: none; }
    .quick-actions { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem; padding: .7rem 1rem; }
    .quick-actions a, .quick-actions button { display: inline-flex; align-items: center; gap: .4rem; padding: .5rem .75rem; border: 1px solid var(--line); border-radius: 10px; background: var(--paper); color: var(--ink); text-decoration: none; font: inherit; font-weight: 700; cursor: pointer; }
    .quick-actions svg { width: 1.1rem; height: 1.1rem; }
    .quick-actions .edit-group { margin-inline-start: auto; color: var(--muted); }
    .quick-actions :focus-visible { outline: 3px solid var(--tone); outline-offset: 2px; }
    .group-edit > summary { cursor: pointer; font-size: 1.2rem; font-weight: 800; }
    .group-edit[open] > summary { margin-bottom: 1.2rem; }
    .settings-head .head-actions { display: flex; gap: .6rem; }
    button:disabled { opacity: .45; cursor: default; }
    .icon-choice { display: flex; gap: .6rem; align-items: center; margin-bottom: .7rem; }
    .icon-choice select { font: inherit; padding: .4rem; border: 1px solid #e0d4c4; border-radius: 8px; background: white; }
    #save-indicator { color: var(--muted); font-size: .85rem; }
    .board-status { display: flex; align-items: center; justify-content: space-between; margin: -1rem 0 1rem; }
    #conflict-box { position: fixed; z-index: 30; top: 15%; right: max(1rem, calc((100vw - 640px) / 2)); width: min(640px, calc(100vw - 2rem)); padding: 1.5rem; border: 2px solid #c45c26; border-radius: 12px; background: #fff6e8; box-shadow: 0 0 0 100vmax #1c161088; }
    #conflict-box[hidden] { display: none; }
    @media (max-width: 800px) {
      .groups, .cards, .tiles, .pair, .book-grid { grid-template-columns: 1fr; }
      .mashov-go { display: none; }
    }
  </style>
</head>

    <section class="block" id="plans-block"></section>
    <section class="block" id="books-block"></section>

  <script>
    const STORE = "brenner-dashboard-v1";
    const STORE_ALIASES = [STORE, "brenner-dashboard:" + location.pathname];
    const TONES = ["#c45c26", "#1f6f6a", "#3d4f8a", "#8a5a1f"];
    const ICONS = {
      classroom: '<path d="M4 6h16v12H4z" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M8 10h8M8 14h5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>',
      formulas: '<path d="M6 18c3-7 9-7 12 0" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/><path d="M9 8.5a3 3 0 1 0 6 0 3 3 0 0 0-6 0Z" stroke="currentColor" stroke-width="1.8" fill="none"/>',
      plan: '<path d="M7 4h7l4 4v12H7V4Z" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M14 4v4h4M9 13h6M9 16h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>',
      book: '<path d="M5 6.5A2.5 2.5 0 0 1 7.5 4H19v14H7.5A2.5 2.5 0 0 0 5 20.5V6.5Z" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M8 8h8M8 11h6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>',
      extra: '<path d="M10 6h10M10 12h10M10 18h10M5 6h.01M5 12h.01M5 18h.01" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>'
    };

    const defaultState = () => ({
      updatedAt: 0,
      mashov: "",
      globalLinks: [],
      groups: [
        Object.assign(group("ט׳", "הקבצה ב׳"), { id: "g-t" }),
        Object.assign(group("י׳", "3 יח״ל"), { id: "g-y" }),
        Object.assign(group("י״א", "4 יהלו״ם"), { id: "g-ya" }),
        Object.assign(group("י״ב", "3 יח״ל"), { id: "g-yb" })
      ]
    });

    function blankGlobalLink() {
      return { id: uid("l"), title: "", url: "" };
    }

    function normalizeGlobalLinks(raw) {
      if (!raw || !Array.isArray(raw.globalLinks)) return [];
      return raw.globalLinks.map((item) => ({
        id: (item && item.id) || uid("l"),
        title: (item && item.title) || "",
        icon: (item && item.icon) || "auto",
        url: (item && item.url) || ""
      }));
    }

    function uid(prefix) {
      return prefix + Math.random().toString(36).slice(2, 8);
    }

    function defaultExtras() {
      return [
        { id: "e-formulas", title: "דף נוסחאות", url: "" },
        { id: "e-classroom", title: "קלאסרום", url: "" }
      ];
    }

    function blankBook() {
      return { title: "", url: "", topics: "" };
    }

    function group(year, level) {
      return {
        id: uid("g"),
        year,
        level,
        planTitle: "פריסה שנתית",
        planUrl: "",
        extras: defaultExtras(),
        books: []
      };
    }

    function normalizeExtras(raw) {
      if (raw && Array.isArray(raw.extras)) {
        return raw.extras.map((item) => ({
          id: (item && item.id) || uid("e"),
          title: (item && item.title) || "",
          icon: (item && item.icon) || "auto",
          url: (item && item.url) || ""
        }));
      }
      const extras = defaultExtras();
      extras[0].url = (raw && raw.formulas) || "";
      extras[1].url = (raw && raw.classroom) || "";
      return extras;
    }

    function normalizeGroup(raw) {
      const blank = group("", "");
      const books = Array.isArray(raw && raw.books) ? raw.books : [];
      return {
        id: (raw && raw.id) || blank.id,
        year: (raw && raw.year) || "",
        level: (raw && raw.level) || "",
        planTitle: (raw && raw.planTitle) || "פריסה שנתית",
        planUrl: (raw && raw.planUrl) || "",
        extras: normalizeExtras(raw),
        books: books.map((b) => ({
          title: (b && b.title) || "",
          url: (b && b.url) || "",
          topics: (b && b.topics) || ""
        }))
      };
    }

    function normalizeState(raw) {
      const base = defaultState();
      if (!raw || !Array.isArray(raw.groups)) {
        return {
          updatedAt: (raw && raw.updatedAt) || 0,
          mashov: (raw && raw.mashov) || "",
          globalLinks: normalizeGlobalLinks(raw),
          groups: base.groups
        };
      }
      return {
        schema: raw.schema || 0,
        history: Array.isArray(raw.history) ? raw.history.slice(-20) : [],
        base: raw.base || null,
        updatedAt: raw.updatedAt || 0,
        mashov: raw.mashov || "",
        globalLinks: normalizeGlobalLinks(raw),
        groups: raw.groups.map(normalizeGroup)
      };
    }

    function readEmbedded() {
      const el = document.getElementById("embedded-settings");
      if (!el) return null;
      try {
        const text = el.textContent.trim();
        return text ? normalizeState(JSON.parse(text)) : null;
      } catch {
        return null;
      }
    }

    function serializeSettings(snapshot) {
      return JSON.stringify(snapshot).replace(/</g, "\\u003c");
    }

    function settingsJson() {
      return serializeSettings(state);
    }

    function writeEmbeddedTag() {
      const el = document.getElementById("embedded-settings");
      if (el) el.textContent = settingsJson();
    }

    function filled(value) {
      return String(value || "").trim();
    }

    function richness(snapshot) {
      if (!snapshot) return 0;
      let n = 0;
      if (filled(snapshot.mashov)) n += 5;
      (snapshot.globalLinks || []).forEach((link) => { if (filled(link.url)) n += 2; });
      (snapshot.groups || []).forEach((g) => {
        if (filled(g.planUrl)) n += 2;
        (g.extras || []).forEach((x) => { if (filled(x.url)) n += 2; });
        (g.books || []).forEach((b) => {
          if (filled(b.url)) n += 2;
          if (filled(b.topics)) n += 0.5;
        });
      });
      return n;
    }

    function isPopulated(snapshot) {
      return richness(snapshot) >= 2;
    }

    function pickState(a, b) {
      const items = [a, b].filter(Boolean);
      if (!items.length) return defaultState();
      const filledItems = items.filter(isPopulated);
      if (filledItems.length === 1) return filledItems[0];
      if (filledItems.length === 2) {
        const newer = (filledItems[0].updatedAt || 0) >= (filledItems[1].updatedAt || 0) ? filledItems[0] : filledItems[1];
        const older = newer === filledItems[0] ? filledItems[1] : filledItems[0];
        return mergePreferFilled(newer, older);
      }
      const edited = items.filter((item) => (item.updatedAt || 0) > 0);
      const pool = edited.length ? edited : items;
      return pool.sort((x, y) => (y.updatedAt || 0) - (x.updatedAt || 0))[0];
    }

    function mergeItem(primary, fallback, keys) {
      const out = Object.assign({}, fallback || {}, primary || {});
      (keys || []).forEach((key) => {
        if (!filled((primary || {})[key]) && filled((fallback || {})[key])) out[key] = fallback[key];
      });
      return out;
    }

    function mergeLists(primary, fallback, keys) {
      const a = primary || [];
      const b = fallback || [];
      const max = Math.max(a.length, b.length);
      const out = [];
      for (let i = 0; i < max; i++) {
        if (a[i] && b[i]) out.push(mergeItem(a[i], b[i], keys));
        else out.push(a[i] || b[i]);
      }
      return out;
    }

    function linkKey(item) {
      if (filled(item && item.url)) return "u:" + String(item.url).trim();
      if (item && item.id) return "i:" + item.id;
      if (filled(item && item.title)) return "t:" + String(item.title).trim();
      return "";
    }

    function mergeGlobalLinks(primary, fallback) {
      const map = new Map();
      (fallback || []).concat(primary || []).forEach((item) => {
        const key = linkKey(item);
        if (!key) return;
        const prev = map.get(key);
        map.set(key, prev ? mergeItem(item, prev, ["title", "url", "id"]) : Object.assign({}, item));
      });
      const seen = new Set();
      const out = [];
      (primary || []).concat(fallback || []).forEach((item) => {
        const key = linkKey(item);
        if (!key || seen.has(key)) return;
        seen.add(key);
        out.push(map.get(key));
      });
      return out;
    }

    function groupKey(g) {
      const yearLevel = `${g.year || ""}|${g.level || ""}`;
      if (yearLevel !== "|") return yearLevel;
      return g.id || "";
    }

    function mergeGroups(primary, fallback) {
      const map = new Map();
      (fallback || []).forEach((g) => map.set(groupKey(g), g));
      const used = new Set();
      const out = (primary || []).map((g) => {
        const key = groupKey(g);
        const other = map.get(key) || (g.id && [...map.values()].find((x) => x.id === g.id));
        used.add(key);
        if (g.id) used.add(g.id);
        if (!other) return g;
        used.add(groupKey(other));
        const merged = mergeItem(g, other, ["year", "level", "planTitle", "planUrl"]);
        merged.extras = mergeLists(g.extras, other.extras, ["title", "url"]);
        merged.books = mergeLists(g.books, other.books, ["title", "url", "topics"]);
        return normalizeGroup(merged);
      });
      (fallback || []).forEach((g) => {
        const key = groupKey(g);
        if (!used.has(key) && !used.has(g.id)) out.push(normalizeGroup(g));
      });
      return out;
    }

    function mergePreferFilled(primary, fallback) {
      if (!isPopulated(fallback)) return primary;
      if (!isPopulated(primary)) return fallback;
      return {
        updatedAt: Math.max(primary.updatedAt || 0, fallback.updatedAt || 0),
        mashov: filled(primary.mashov) ? primary.mashov : fallback.mashov,
        globalLinks: mergeGlobalLinks(primary.globalLinks, fallback.globalLinks),
        groups: mergeGroups(primary.groups, fallback.groups)
      };
    }

    function parseEmbeddedFromText(text) {
      const match = text.match(/<script type="application\/json" id="embedded-settings">\s*([\s\S]*?)\s*<\/script>/);
      if (!match) return null;
      try {
        return normalizeState(JSON.parse(match[1]));
      } catch {
        return null;
      }
    }

    function readLocal() {
      let best = null;
      STORE_ALIASES.forEach((key) => {
        try {
          const raw = localStorage.getItem(key);
          if (!raw) return;
          const data = normalizeState(JSON.parse(raw));
          if (!best || (data.updatedAt || 0) >= (best.updatedAt || 0)) best = data;
        } catch {}
      });
      return best;
    }

    function writeLocal() {
      try {
        const payload = JSON.stringify(state);
        STORE_ALIASES.forEach((key) => localStorage.setItem(key, payload));
        return true;
      } catch {
        return false;
      }
    }

    const HANDLE_DB = "brenner-dashboard-file";
    const HANDLE_STORE = "handles";
    const HANDLE_KEY = "html";
    let fileHandle = null;
    let fileWriteTimer = null;
    let knownDisk = readEmbedded();
    let fileWriteInFlight = false;

    function supportsFileApi() { return Boolean(window.showOpenFilePicker);
    }

    function cloneState(snapshot) {
      return normalizeState(JSON.parse(JSON.stringify(snapshot)));
    }

    function isFileSynced() {
      return Boolean(knownDisk) && contentKey(state) === contentKey(knownDisk);
    }

    function needsFileSave() { return !isFileSynced();
    }

    function saveActionLabel() { return fileHandle ? "נסה לשמור שוב" : "אפשר שמירה לקובץ הקיים";
    }

    function suggestedFileName() {
      try {
        const name = decodeURIComponent((location.pathname.split("/").pop() || "").trim());
        return name.endsWith(".html") ? name : "לוח_בקרה.html";
      } catch {
        return "לוח_בקרה.html";
      }
    }

    function htmlWithSettingsFromText(text, snapshot) {
      const json = serializeSettings(snapshot);
      const re = /(<script type="application\/json" id="embedded-settings">)([\s\S]*?)(<\/script>)/;
      const next = text.replace(re, (_, open, _body, close) => open + "\n" + json + "\n  " + close);
      if (!/id="embedded-settings"/.test(text)) throw new Error("missing-embedded");
      return next;
    }

    function openHandleDb() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(HANDLE_DB, 1);
        req.onupgradeneeded = () => {
          if (!req.result.objectStoreNames.contains(HANDLE_STORE)) {
            req.result.createObjectStore(HANDLE_STORE);
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function storeFileHandle(handle) {
      const db = await openHandleDb();
      await new Promise((resolve, reject) => {
        const tx = db.transaction(HANDLE_STORE, "readwrite");
        tx.objectStore(HANDLE_STORE).put(handle, HANDLE_KEY);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    async function loadStoredHandle() {
      try {
        const db = await openHandleDb();
        return await new Promise((resolve, reject) => {
          const tx = db.transaction(HANDLE_STORE, "readonly");
          const req = tx.objectStore(HANDLE_STORE).get(HANDLE_KEY);
          req.onsuccess = () => resolve(req.result || null);
          req.onerror = () => reject(req.error);
        });
      } catch {
        return null;
      }
    }

    async function ensureWritePermission(handle) {
      const opts = { mode: "readwrite" };
      if ((await handle.queryPermission(opts)) === "granted") return true;
      return (await handle.requestPermission(opts)) === "granted";
    }

    async function pickDashboardFile() {
      if (!supportsFileApi()) throw new Error("unsupported");
      const [handle] = await window.showOpenFilePicker({ multiple: false, types: [{ description: "לוח הבקרה הקיים", accept: { "text/html": [".html"] } }] });
      const text = await (await handle.getFile()).text();
      if (!parseEmbeddedFromText(text) || handle.name !== suggestedFileName()) throw new Error("wrong-file");
      if (!(await ensureWritePermission(handle))) throw new Error("permission");
      return handle;
    }

    function applySnapshot(snapshot) {
      state = snapshot;
      writeLocal();
      writeEmbeddedTag();
      renderBoard();
      if (settingsEl.classList.contains("on")) renderSettings();
    }

    function snapshotForDisk() { return cloneState(state);
    }

    async function writeToLinkedFile() {
      if (writePromise) { await writePromise; return needsFileSave() ? writeToLinkedFile() : true; }
      writePromise = (async () => {
        if (!fileHandle || conflict) return false;
        if (!(await ensureWritePermission(fileHandle))) throw new Error("permission");
        const text = await (await fileHandle.getFile()).text();
        const onDisk = parseEmbeddedFromText(text);
        if (!onDisk) throw new Error("wrong-file");
        if (contentKey(onDisk) !== contentKey(knownDisk) && contentKey(onDisk) !== contentKey(state)) {
          conflict = onDisk;
          showConflict();
          return false;
        }
        const snapshot = cloneState(state);
        const html = htmlWithSettingsFromText(text, snapshot);
        const writable = await fileHandle.createWritable();
        try { await writable.write(html); await writable.close(); }
        catch (err) { try { await writable.abort(); } catch {} throw err; }
        knownDisk = snapshot;
        state.base = core(snapshot);
        writeLocal();
        writeEmbeddedTag();
        return true;
      })();
      try { return await writePromise; } finally { writePromise = null; }
    }





    function scheduleFileWrite() {
      clearTimeout(fileWriteTimer);
      if (!fileHandle || conflict) return;
      fileWriteTimer = setTimeout(async () => {
        try {
          const ok = await writeToLinkedFile();
          if (ok) setStatus(needsFileSave() ? "שומר…" : "נשמר בקובץ");
          if (ok && needsFileSave()) scheduleFileWrite();
        } catch { setStatus("טרם נשמר בקובץ — נסו שוב", true); }
        updateSyncBanner();
      }, 800);
    }

    async function restoreFileHandle() {
      fileHandle = await loadStoredHandle();
      if (!fileHandle) return;
      try {
        if ((await fileHandle.queryPermission({ mode: "readwrite" })) !== "granted") {
          fileHandle = null;
        }
      } catch {
        fileHandle = null;
      }
    }



    async function linkAndWriteFile() {
      try {
        if (!supportsFileApi()) { setStatus("לשמירה באותו קובץ יש לפתוח בדפדפן כרום או אדג׳ במחשב", true); return false; }
        if (!fileHandle) {
          fileHandle = await pickDashboardFile();
          try { await storeFileHandle(fileHandle); } catch {}
        }
        const ok = await writeToLinkedFile();
        if (ok) setStatus(needsFileSave() ? "שומר…" : "נשמר בקובץ");
        updateSyncBanner();
        return ok;
      } catch (err) {
        setStatus(err.name === "AbortError" ? "טרם נשמר — יש לבחור את לוח הבקרה הקיים" : err.message === "wrong-file" ? "יש לבחור את קובץ לוח הבקרה הקיים שממנו נפתח העמוד" : "לא ניתן לשמור כרגע — השינויים מוגנים בדפדפן", true);
        if (err.message === "wrong-file") fileHandle = null;
        updateSyncBanner();
        return false;
      }
    }

    let saveStatus = "השינויים חייבים להישמר לקובץ כדי לסנכרן בין מכשירים";
    let saveErr = false;

    function setStatus(text, err) {
      saveStatus = text;
      saveErr = Boolean(err);
      document.getElementById("save-indicator").textContent = text;
      const el = document.getElementById("save-status");
      if (el) {
        el.textContent = saveStatus;
        el.classList.toggle("err", saveErr);
      }
    }

    function persist() {
      state.schema = 2;
      state.updatedAt = Date.now();
      writeEmbeddedTag();
      const cached = writeLocal();
      if (!cached) {
        setStatus("הדפדפן לא הצליח לשמור עותק התאוששות — יש לשמור לקובץ", true);
      }
      if (fileHandle) {
        setStatus("שומר לקובץ…");
        scheduleFileWrite();
      } else {
        setStatus(cached ? "השינוי מוגן בדפדפן — אפשרו שמירה לקובץ הקיים" : "יש לאפשר שמירה לקובץ — עותק ההתאוששות בדפדפן אינו זמין", true);
      }
      updateSyncBanner();
      if (settingsEl.classList.contains("on")) {
        const btn = document.getElementById("settings-save-file");
        if (btn) btn.textContent = saveActionLabel();
      }
    }

    function loadAll() {
      const embedded = readEmbedded();
      const local = readLocal();
      if (!local) return embedded || defaultState();
      if (local.schema >= 2 || (embedded && embedded.schema >= 2)) {
        if (contentKey(local) === contentKey(embedded)) return embedded;
        if (local.base && contentKey(local.base) === contentKey(local)) return embedded;
        if (local.base && contentKey(local.base) === contentKey(embedded)) return local;
        conflict = embedded;
        return local;
      }
      return pickState(local, embedded);
    }

    function href(url) {

          : supportsFileApi()

    function findGroup(id) {
      return state.groups.find((g) => g.id === id);
    }

    function persistAndPaint() {
      persist();
      renderBoard();
    }

    let inputTarget = null;
    settingsBody.addEventListener("focusin", (e) => { if (e.target.matches("input,textarea,select")) inputTarget = null; });
    settingsBody.addEventListener("input", (e) => {
      const t = e.target;
      if (!t.dataset.field) return;
      if (inputTarget !== t) { remember(); inputTarget = t; }
      if (t.dataset.field === "mashov") {
        state.mashov = t.value;
        persistAndPaint();
        return;
      }
      if (t.dataset.globalLink != null) {
        const link = (state.globalLinks || [])[Number(t.dataset.globalLink)];
        if (!link) return;
        link[t.dataset.field] = t.value;
        persistAndPaint();
        return;
      }
      const g = findGroup(t.dataset.g);
      if (!g) return;
      if (t.dataset.book != null) {
        g.books[Number(t.dataset.book)][t.dataset.field] = t.value;
      } else if (t.dataset.extra != null) {
        g.extras[Number(t.dataset.extra)][t.dataset.field] = t.value;
      } else {
        g[t.dataset.field] = t.value;
      }
      persistAndPaint();
    });

    settingsBody.addEventListener("click", (e) => {
      const add = e.target.closest("[data-add-group]");
      const remove = e.target.closest("[data-remove]");
      const addBook = e.target.closest("[data-add-book]");
      const removeBook = e.target.closest("[data-remove-book]");
      const addExtra = e.target.closest("[data-add-extra]");
      const removeExtra = e.target.closest("[data-remove-extra]");
      const addGlobal = e.target.closest("[data-add-global-link]");
      const removeGlobal = e.target.closest("[data-remove-global-link]");
      if (add || remove || addBook || removeBook || addExtra || removeExtra || addGlobal || removeGlobal) remember();
      if (add) {
        state.groups.push(group("", ""));
        persistAndPaint();
        renderSettings();
      }
      if (remove) {
        state.groups = state.groups.filter((g) => g.id !== remove.dataset.remove);
        persistAndPaint();
        renderSettings();
      }
      if (addBook) {
        const g = findGroup(addBook.dataset.addBook);
        if (g) {
          g.books.push(blankBook());
          persistAndPaint();
          renderSettings();
        }
      }
      if (removeBook) {
        const g = findGroup(removeBook.dataset.removeBook);
        if (g) {
          g.books.splice(Number(removeBook.dataset.bookIndex), 1);
          persistAndPaint();
          renderSettings();
        }
      }
      if (addExtra) {
        const g = findGroup(addExtra.dataset.addExtra);
        if (g) {
          g.extras.push({ id: uid("e"), title: "", url: "" });
          persistAndPaint();
          renderSettings();
        }
      }
      if (removeExtra) {
        const g = findGroup(removeExtra.dataset.removeExtra);
        if (g) {
          g.extras.splice(Number(removeExtra.dataset.extraIndex), 1);
          persistAndPaint();
          renderSettings();
        }
      }
      if (addGlobal) {
        if (!state.globalLinks) state.globalLinks = [];
        state.globalLinks.push(blankGlobalLink());
        persistAndPaint();
        renderSettings();
      }
      if (removeGlobal) {
        state.globalLinks.splice(Number(removeGlobal.dataset.removeGlobalLink), 1);
        persistAndPaint();
        renderSettings();
      }
    });

    function openSettings(id) {
      renderSettings();
      settingsEl.classList.add("on");
      document.body.style.overflow = "hidden";
      scrimEl.classList.add("on");
      settingsEl.setAttribute("aria-hidden", "false");
      settingsEl.inert = false;
      updateUndo();
      const editor = [...settingsBody.querySelectorAll(".group-edit")].find(x => x.dataset.id === id);
      if (editor) { editor.open = true; editor.scrollIntoView({ block: "start" }); editor.querySelector("summary").focus(); }
      else settingsEl.querySelector("[data-close-settings]").focus();
    }

    async function flushFileSave() {
      clearTimeout(fileWriteTimer);
      fileWriteTimer = null;
      if (fileHandle) {
        fileWriteInFlight = true;
        try {
          const ok = await writeToLinkedFile();
          if (ok === true) setStatus("נשמר לקובץ");
          else if (ok === "adopted") setStatus("נטען מהקובץ");
          else return false;
          return !needsFileSave();
        } catch {
          return false;
        } finally {
          fileWriteInFlight = false;
          updateSyncBanner();
        }
      }
      return linkAndWriteFile();
    }

    async function closeSettings() {
      if (needsFileSave() || fileWriteInFlight) {
        setStatus("שומר לקובץ…");
        const ok = await flushFileSave();
        if (!ok && needsFileSave()) {
          setStatus("השמירה לקובץ לא הושלמה — בחרו את הקובץ או נסו שוב", true);
          renderSettings();
          const btn = document.getElementById("settings-save-file");
          if (btn) btn.focus();
          return;
        }
      }
      settingsEl.classList.remove("on");
      document.body.style.overflow = "";
      scrimEl.classList.remove("on");
      settingsEl.setAttribute("aria-hidden", "true");
      settingsEl.inert = true;
      document.querySelector("[data-open-settings]").focus();
    }

    function groupFolders() {
      return [...groupsEl.querySelectorAll("details.folder")];
    }

    function expandAllGroups() {
      const folders = groupFolders();
      const openAll = folders.some((folder) => !folder.open);
      folders.forEach((folder) => { folder.open = openAll; });
    }

    document.addEventListener("click", (e) => {
      const edit = e.target.closest("[data-edit-group]");
      if (edit) openSettings(edit.dataset.editGroup);
      if (e.target.closest("[data-undo]")) undo();
      const resolution = e.target.closest("[data-resolve]");
      if (resolution) resolveConflict(resolution.dataset.resolve);
      if (e.target.closest("[data-expand-groups]")) expandAllGroups();
      if (e.target.closest("[data-open-settings]")) openSettings();
      if (e.target.closest("[data-close-settings]")) closeSettings();
      if (e.target.closest("[data-link-file]")) linkAndWriteFile();
    });

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && settingsEl.classList.contains("on")) closeSettings();
    });

    groupsEl.addEventListener("toggle", (e) => {
      const card = e.target;
      if (!card.classList || !card.classList.contains("books-card")) return;
      const panel = card.closest(".folder-body").querySelector(`[data-books-panel="${card.dataset.id}"]`);
      if (panel) panel.hidden = !card.open;
    }, true);

    function escapeHtml(s) {
      return String(s)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;");
    }

    function escapeAttr(s) {
      return escapeHtml(s).replaceAll('"', "&quot;");
    }

    let writePromise = null;
    let conflict = null;
    function core(snapshot) {
      if (!snapshot) return null;
      return { mashov: snapshot.mashov || "", globalLinks: snapshot.globalLinks || [], groups: snapshot.groups || [] };
    }
    function contentKey(snapshot) { return JSON.stringify(core(snapshot)); }
    function remember() {
      state.history = [...(state.history || []), { ...core(cloneState(state)), updatedAt: state.updatedAt }].slice(-20);
      updateUndo();
    }
    function updateUndo() { document.querySelectorAll("[data-undo]").forEach(b => b.disabled = !(state.history || []).length); }
    function undo() {
      if (!(state.history || []).length) return;
      const history = state.history.slice();
      const previous = history.pop();
      state = { ...state, ...previous, history };
      inputTarget = null;
      persistAndPaint(); renderSettings(); updateUndo();
    }
    function showConflict() {
      document.getElementById("conflict-box").hidden = !conflict;
      setStatus("הקובץ השתנה — יש לבחור באיזו גרסה להמשיך", true);
    }
    function resolveConflict(choice) {
      if (!conflict) return;
      const disk = conflict;
      remember();
      if (choice === "disk") state = { ...state, ...core(disk) };
      else state.history = [...state.history, { ...core(disk), updatedAt: disk.updatedAt }].slice(-20);
      knownDisk = cloneState(disk);
      conflict = null;
      document.getElementById("conflict-box").hidden = true;
      persistAndPaint(); renderSettings();
    }
    function isClassroom(item) { return /classroom\.google\.com/i.test(item.url || "") || /קלאסרום|classroom/i.test(item.title || ""); }
    function resourceIcon(item) {
      const key = item.icon && item.icon !== "auto" ? item.icon : isClassroom(item) ? "classroom" : /נוסחאות/.test(item.title || "") ? "formulas" : /פריסה|תכנית/.test(item.title || "") ? "plan" : "extra";
      return ICONS[key] || ICONS.extra;
    }
    function iconSelect(item, attrs) {
      const options = { auto: "זיהוי אוטומטי", extra: "קישור כללי", classroom: "כיתה", formulas: "נוסחאות", plan: "מסמך", book: "ספר" };
      return `<label class="icon-choice">אייקון <select ${attrs} data-field="icon">${Object.entries(options).map(([k,v]) => `<option value="${k}" ${(item.icon || "auto") === k ? "selected" : ""}>${v}</option>`).join("")}</select></label>`;
    }
    const VIEW_KEY = "brenner-dashboard-view:" + location.pathname;
    function readView() {
      try { const view = JSON.parse(localStorage.getItem(VIEW_KEY)); if (view && Array.isArray(view.groups) && Array.isArray(view.groupBooks)) return view; } catch {}
      return { groups: [], groupBooks: [], plans: false, books: false, links: false };
    }
    function updateExpandButton() {
      const all = groupFolders().length > 0 && groupFolders().every(x => x.open);
      const button = document.querySelector("[data-expand-groups]");
      button.title = all ? "סגור את כל הקבוצות" : "פתח את כל הקבוצות";
      button.setAttribute("aria-label", button.title);
      button.setAttribute("aria-expanded", String(all));
    }
    document.addEventListener("toggle", e => {
      if (!e.target.closest("main")) return;
      try { localStorage.setItem(VIEW_KEY, JSON.stringify(snapshotOpen())); } catch {}
      updateExpandButton();
    }, true);
    window.addEventListener("beforeunload", e => { if (needsFileSave()) { e.preventDefault(); e.returnValue = ""; } });
    settingsEl.inert = true;
    state = loadAll();
    if (!state.base) state.base = core(knownDisk);
    if (conflict) showConflict();
    writeLocal();
    if (isFileSynced()) knownDisk = cloneState(state);
    renderBoard();
    updateSyncBanner();
    if (needsFileSave() && !conflict) setStatus("יש שינויים מוגנים בדפדפן שטרם נשמרו לקובץ", true);
    restoreFileHandle().then(async () => {
      if (fileHandle && needsFileSave() && !conflict) {
        try { await writeToLinkedFile(); setStatus(needsFileSave() ? "טרם נשמר בקובץ" : "נשמר בקובץ", needsFileSave()); }
        catch { setStatus("טרם נשמר בקובץ — נסו שוב", true); }
      }
      updateSyncBanner();
      if (settingsEl.classList.contains("on")) renderSettings();
    });
  </script>
</body>
</html>
