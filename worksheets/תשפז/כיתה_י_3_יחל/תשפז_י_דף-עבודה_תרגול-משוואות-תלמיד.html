<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>תרגול משוואות</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"
    onload="renderMathInElement(document.body, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '\\(', right: '\\)', display: false}
      ],
      throwOnError: false
    });"></script>
  <style>
    :root {
      --ink: #1a2332;
      --accent: #1f4e79;
      --line: #cfd6e2;
      --font: "David", "Times New Roman", "Segoe UI", Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    @page {
      size: A4;
      margin: 14mm 16mm;
    }
    html, body {
      margin: 0;
      padding: 0;
      background: #fff;
      color: var(--ink);
      font-family: var(--font);
      height: 100%;
    }
    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      padding: 12mm 14mm;
      max-width: 210mm;
      margin-inline: auto;
    }
    h1 {
      flex: 0 0 auto;
      margin: 0 0 10mm;
      text-align: center;
      font-size: 24pt;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 0.02em;
    }
    .grid {
      flex: 1 1 auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      column-gap: 14mm;
      min-height: 0;
    }
    .col {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 100%;
    }
    .item {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      flex: 1 1 0;
      padding: 6mm 2mm;
      border-bottom: 1px solid var(--line);
      break-inside: avoid;
      page-break-inside: avoid;
    }
    .col .item:last-child {
      border-bottom: none;
    }
    .num {
      flex: 0 0 auto;
      font-size: 14pt;
      font-weight: 700;
      color: var(--accent);
      line-height: 1;
    }
    .eq {
      flex: 1 1 auto;
      direction: ltr;
      unicode-bidi: isolate;
      text-align: left;
      font-size: 16pt;
      line-height: 1.4;
    }
    .katex { direction: ltr; unicode-bidi: isolate; font-size: 1.08em; }
    @media print {
      html, body { height: auto; }
      body {
        padding: 0;
        max-width: none;
        min-height: 0;
        height: 269mm; /* A4 minus page margins */
      }
      h1 { margin-bottom: 8mm; font-size: 22pt; }
      a { color: inherit; text-decoration: none; }
    }
  </style>
</head>
<body>
  <h1>תרגול משוואות</h1>
  <div class="grid">
    <div class="col">
      <div class="item"><span class="num">1.</span><span class="eq">\(6(x+1)-2(x-3)=28\)</span></div>
      <div class="item"><span class="num">2.</span><span class="eq">\(5(x-2)+3(x+4)=26\)</span></div>
      <div class="item"><span class="num">3.</span><span class="eq">\(4(2x+1)-3(x-5)=29\)</span></div>
      <div class="item"><span class="num">4.</span><span class="eq">\((x+3)(x-2)=14\)</span></div>
      <div class="item"><span class="num">5.</span><span class="eq">\(\dfrac{x-3}{2}=13\)</span></div>
    </div>
    <div class="col">
      <div class="item"><span class="num">6.</span><span class="eq">\(\dfrac{2x+1}{5}=3\)</span></div>
      <div class="item"><span class="num">7.</span><span class="eq">\(\dfrac{3x-6}{4}=6\)</span></div>
      <div class="item"><span class="num">8.</span><span class="eq">\(x^{2}+5x-14=0\)</span></div>
      <div class="item"><span class="num">9.</span><span class="eq">\(x^{2}-3x-10=0\)</span></div>
      <div class="item"><span class="num">10.</span><span class="eq">\(x^{2}+4x-12=0\)</span></div>
    </div>
  </div>
</body>
</html>
